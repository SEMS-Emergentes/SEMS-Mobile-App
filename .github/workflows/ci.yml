# Compila la aplicacion y ejecuta las pruebas unitarias en cada cambio.
#
# Hasta ahora este repositorio era el unico de SEMS sin integracion continua:
# tenia 308 pruebas que nadie corria al abrir un pull request.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama deja obsoleta la ejecucion anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # Guarda ~/.gradle entre ejecuciones; sin esto cada build vuelve a
      # descargar la distribucion de Gradle y todas las dependencias.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # El proyecto compila contra compileSdk 36, que no todas las imagenes de
      # los runners traen. Se instala explicitamente para que el build no
      # dependa de lo que la imagen tenga ese dia.
      #
      # sdkmanager se busca en vez de invocarlo por su nombre: la imagen trae el
      # SDK pero deja cmdline-tools en un directorio con numero de version que no
      # esta en el PATH, asi que llamarlo a secas termina en "command not found".
      - name: Install the Android SDK packages the project needs
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mgr="$(find "$sdk/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$mgr" ]; then
            echo "No se encontro sdkmanager bajo $sdk/cmdline-tools" >&2
            exit 1
          fi
          yes | "$mgr" --licenses > /dev/null 2>&1 || true
          "$mgr" "platforms;android-36" "build-tools;36.0.0"

      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      # Los informes son lo unico que dice que prueba fallo cuando el log queda
      # cortado, y se pierden al terminar el job si no se suben.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
