# Compila el APK de la aplicacion y lo publica como GitHub Release (tag apk-latest)
# en cada push a develop. El APK apunta al backend desplegado en Render.
name: APK

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK packages the project needs
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mgr="$(find "$sdk/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          yes | "$mgr" --licenses > /dev/null 2>&1 || true
          "$mgr" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sems.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest sems.apk \
            --target "$GITHUB_SHA" \
            --title "SEMS Mobile App - APK" \
            --notes "APK de SEMS generado desde develop (${GITHUB_SHA::7}). Apunta al backend desplegado en Render."
